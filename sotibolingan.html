    <script>

document.addEventListener("DOMContentLoaded", function () {
    let purchases = JSON.parse(localStorage.getItem("purchases")) || [];
    let olinganNarsa = document.querySelector(".olinganNarsa");
    let clearAllBtn = document.querySelector(".clear-all"); // Knopkani olish

    if (purchases.length === 0) {
        olinganNarsa.innerHTML = "<p>Hech narsa sotib olinmagan.</p>";
    } else {
        purchases.forEach((itemHTML, index) => {
            let tempDiv = document.createElement("div");
            tempDiv.innerHTML = itemHTML;

            let productDiv = tempDiv.firstElementChild;

            if (productDiv && productDiv.classList.contains("rectangle")) {
                productDiv.classList.add("purchased");

                let productImage = productDiv.querySelector("img");
                let productName = productDiv.querySelector("p");

                let newDiv = document.createElement("div");
                newDiv.classList.add("purchased-item");

                if (productImage) {
                    let imgClone = productImage.cloneNode(true);
                    newDiv.appendChild(imgClone);
                }

                if (productName) {
                    let nameClone = productName.cloneNode(true);
                    newDiv.appendChild(nameClone);
                }

                olinganNarsa.appendChild(newDiv);
            }
        });
    }

    if (clearAllBtn) {
        clearAllBtn.addEventListener("click", function () {
            localStorage.removeItem("purchases"); 
            olinganNarsa.innerHTML = "<p>Hech narsa sotib olinmagan.</p>";
        });
    }
});


    </script>
